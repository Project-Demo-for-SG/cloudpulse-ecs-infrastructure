# Run a demo pipeline to validate and deploy Terraform infrastructure using GitHub Actions. This workflow is triggered on pull requests and pushes to the main branch, excluding changes to markdown files, documentation, and the architecture diagram. It includes jobs for validating Terraform configuration, testing AWS OIDC connection, and applying Terraform changes.
name: Terraform Infrastructure

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'cloudpulse-architecture.svg'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'cloudpulse-architecture.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  oidc-test:
    name: Test AWS OIDC connection
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-OIDC-Test-${{ github.run_id }}

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

  apply:
    name: Apply Terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    needs: [validate, oidc-test]
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      WORKSPACE: ci-${{ github.event.repository.name }}-${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Select Terraform workspace
        shell: bash
        run: |
          workspace="$(printf '%s' "$WORKSPACE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g; s/^-+|-+$//g')"
          if [[ -z "$workspace" ]]; then
            echo "Workspace name is empty after sanitizing the repository and branch names." >&2
            exit 1
          fi
          echo "Workspace is ${workspace}"
          terraform workspace select "$workspace" || terraform workspace new "$workspace"
          echo "TF_WORKSPACE=${workspace}" >> "$GITHUB_ENV"

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -out=t.plan

      - name: Apply Terraform plan
        run: terraform apply -input=false -no-color t.plan
