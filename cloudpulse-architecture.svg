<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">CloudPulse AWS infrastructure architecture</title>
  <desc id="description">A browser reaches an internet-facing Application Load Balancer through an Internet Gateway. ALB nodes are shown inside the public subnet in each of two Availability Zones. The ALB routes traffic to frontend and backend Fargate services in private subnets in a VPC.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .region-title { font-size: 17px; font-weight: 700; fill: #334155; }
      .vpc-title { font-size: 20px; font-weight: 700; fill: #1d4ed8; }
      .az-title { font-size: 17px; font-weight: 700; fill: #334155; }
      .card-title { font-size: 16px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .arrow-label { font-size: 13px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="54" y="58" class="eyebrow">CLOUDPULSE · AWS INFRASTRUCTURE</text>
  <text x="54" y="101" class="title">How a request reaches the app</text>
  <text x="54" y="132" class="subtitle">Multi-AZ architecture</text>

  <rect x="270" y="155" width="1280" height="875" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="188" class="region-title">AWS REGION · us-east-1</text>

  <rect x="300" y="205" width="1220" height="670" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="330" y="240" class="vpc-title">VPC · 10.0.0.0/16</text>
  <text x="1320" y="239" class="small">Multi-AZ network</text>

  <rect x="320" y="365" width="560" height="405" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="320" y="365" width="560" height="43" rx="16" fill="#e2e8f0"/>
  <path d="M320 392 V408 H880 V392" fill="#e2e8f0"/>

  <rect x="900" y="365" width="580" height="405" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="900" y="365" width="580" height="43" rx="16" fill="#e2e8f0"/>
  <path d="M900 392 V408 H1480 V392" fill="#e2e8f0"/>

  <rect x="340" y="420" width="520" height="145" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="920" y="420" width="540" height="145" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="340" y="585" width="520" height="165" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <rect x="920" y="585" width="540" height="165" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>

  <rect x="335" y="260" width="190" height="66" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="565" y="250" width="900" height="86" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="45" y="270" width="205" height="82" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <path d="M250 311 H328" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M525 293 H557" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1015 336 V350 H600 V491" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M1015 350 H1190 V491" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M600 535 V581" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <path d="M1190 535 V581" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>

  <rect x="358" y="490" width="484" height="45" rx="9" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="490" width="504" height="45" rx="9" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="340" y="805" width="760" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="1120" y="805" width="370" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="500" y="900" width="350" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="940" y="900" width="350" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <path d="M720 849 V875 H675 V893" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#blue-arrow)"/>
  <path d="M720 875 H1115 V893" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#blue-arrow)"/>

  <text x="430" y="292" text-anchor="middle" class="card-title">Internet Gateway</text>
  <text x="430" y="314" text-anchor="middle" class="small">attached to VPC</text>
  <text x="1015" y="278" text-anchor="middle" class="card-title">ONE internet-facing ALB · HTTP :80</text>
  <text x="1015" y="302" text-anchor="middle" class="card-copy">/api* → backend :3000  ·  all other paths → frontend :80</text>
  <text x="1015" y="322" text-anchor="middle" class="small">ALB nodes are placed in both public subnets below</text>
  <text x="147" y="302" text-anchor="middle" class="card-title">Browser / client</text>
  <text x="147" y="326" text-anchor="middle" class="card-copy">HTTP request</text>

  <text x="345" y="394" class="az-title">AVAILABILITY ZONE 1</text>
  <text x="925" y="394" class="az-title">AVAILABILITY ZONE 2</text>

  <text x="360" y="449" class="card-title">PUBLIC SUBNET</text>
  <text x="360" y="472" class="card-copy">10.0.1.0/24 · route to Internet Gateway</text>
  <text x="600" y="519" text-anchor="middle" class="card-title">ALB node · shared load balancer</text>

  <text x="940" y="449" class="card-title">PUBLIC SUBNET</text>
  <text x="940" y="472" class="card-copy">10.0.2.0/24 · route to Internet Gateway</text>
  <text x="1190" y="519" text-anchor="middle" class="card-title">ALB node · shared load balancer</text>

  <text x="360" y="616" class="card-title">PRIVATE SUBNET</text>
  <text x="548" y="616" class="card-copy">10.0.3.0/24</text>
  <text x="360" y="639" class="small">Possible Fargate task placement</text>
  <rect x="360" y="650" width="230" height="48" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <rect x="610" y="650" width="230" height="48" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="475" y="680" text-anchor="middle" class="card-copy">Frontend · port 80</text>
  <text x="725" y="680" text-anchor="middle" class="card-copy">Backend · port 3000</text>
  <text x="360" y="731" class="small">No public IP · no NAT route</text>

  <text x="940" y="616" class="card-title">PRIVATE SUBNET</text>
  <text x="1128" y="616" class="card-copy">10.0.4.0/24</text>
  <text x="940" y="639" class="small">Possible Fargate task placement</text>
  <rect x="940" y="650" width="240" height="48" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <rect x="1200" y="650" width="240" height="48" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1060" y="680" text-anchor="middle" class="card-copy">Frontend · port 80</text>
  <text x="1320" y="680" text-anchor="middle" class="card-copy">Backend · port 3000</text>
  <text x="940" y="731" class="small">No public IP · no NAT route</text>

  <text x="720" y="833" text-anchor="middle" class="card-copy">Private VPC endpoints · ECR API / Docker · CloudWatch Logs · S3 gateway</text>
  <text x="1305" y="833" text-anchor="middle" class="card-copy">Cloud Map · backend DNS</text>
  <text x="675" y="931" text-anchor="middle" class="card-title">Amazon ECR</text>
  <text x="675" y="955" text-anchor="middle" class="card-copy">Frontend and backend images</text>
  <text x="1115" y="931" text-anchor="middle" class="card-title">Amazon CloudWatch Logs</text>
  <text x="1115" y="955" text-anchor="middle" class="card-copy">Separate log group per service</text>

</svg>
